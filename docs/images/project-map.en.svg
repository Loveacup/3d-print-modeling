<g font-family="Helvetica Neue, PingFang SC, sans-serif" fill="#193e3b">
<title id="title">From need to something that works</title><desc id="desc">Concept map / 概念示意. Modeling and visual communication connect to human needs, research, manufacturing, evidence and learning. Not a tested product.</desc>
<text x="48" y="52" text-anchor="start" font-size="20" font-weight="600" fill="#193e3b">3D PRINT MODELING / A CONNECTED PRACTICE</text>
<text x="48" y="108" text-anchor="start" font-size="40" font-weight="700" fill="#193e3b">From need to something that works</text>
<rect x="180" y="150" width="600" height="110" rx="18" fill="#ffffff" stroke="#c5d3cc" stroke-width="2"/>
<text x="480" y="193" text-anchor="middle" font-size="34" font-weight="600" fill="#193e3b">Understand the person</text>
<text x="480" y="232" text-anchor="middle" font-size="27" font-weight="400" fill="#193e3b">Purpose / context / constraints</text>
<path d="M480 270V303" fill="none" stroke="#3b756e" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<rect x="48" y="318" width="864" height="228" rx="18" fill="#193e3b" stroke="none" stroke-width="2"/>
<text x="480" y="360" text-anchor="middle" font-size="23" font-weight="600" fill="#b7d8cd">DESIGN AT THE CENTER</text>
<path d="M480 386V510" stroke="#688e82" stroke-width="2"/>
<text x="267" y="427" text-anchor="middle" font-size="44" font-weight="700" fill="#fff9e8">Model</text>
<text x="267" y="479" text-anchor="middle" font-size="27" font-weight="400" fill="#d9e7de">Form / interfaces / assembly</text>
<text x="693" y="427" text-anchor="middle" font-size="40" font-weight="700" fill="#fff9e8">Explain visually</text>
<text x="693" y="479" text-anchor="middle" font-size="27" font-weight="400" fill="#d9e7de">Sketch / section / product view</text>
<path d="M267 558V592" fill="none" stroke="#3b756e" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M693 558V592" fill="none" stroke="#3b756e" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<rect x="48" y="608" width="414" height="110" rx="18" fill="#ffffff" stroke="#c5d3cc" stroke-width="2"/>
<rect x="498" y="608" width="414" height="110" rx="18" fill="#ffffff" stroke="#c5d3cc" stroke-width="2"/>
<text x="255" y="652" text-anchor="middle" font-size="34" font-weight="600" fill="#193e3b">Research</text>
<text x="255" y="691" text-anchor="middle" font-size="27" font-weight="400" fill="#193e3b">Mechanisms / alternatives</text>
<text x="705" y="652" text-anchor="middle" font-size="34" font-weight="600" fill="#193e3b">Manufacture</text>
<text x="705" y="691" text-anchor="middle" font-size="25" font-weight="400" fill="#193e3b">Orientation / seams / supports</text>
<path d="M255 729V750H480V771" fill="none" stroke="#3b756e" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M705 729V750H480" fill="none" stroke="#3b756e" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="134" y="790" width="692" height="110" rx="18" fill="#dce8df" stroke="none" stroke-width="2"/>
<text x="480" y="834" text-anchor="middle" font-size="34" font-weight="600" fill="#193e3b">Check the evidence</text>
<text x="480" y="875" text-anchor="middle" font-size="28" font-weight="400" fill="#193e3b">Geometry / toolpaths / physical use</text>
<path d="M837 845H938V343H925" fill="none" stroke="#3b756e" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M480 907V928" fill="none" stroke="#3b756e" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 8"/>
<path d="M39 976H22V205H167" fill="none" stroke="#3b756e" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 8"/>
<rect x="48" y="940" width="864" height="72" rx="18" fill="#e9c77e" stroke="none" stroke-width="2"/>
<text x="480" y="970" text-anchor="middle" font-size="28" font-weight="600" fill="#193e3b">Carry the learning forward</text>
<text x="480" y="999" text-anchor="middle" font-size="24" font-weight="400" fill="#193e3b">Issues &gt; lessons &gt; next use &gt; corrections</text>
<text x="480" y="1044" text-anchor="middle" font-size="23" font-weight="400" fill="#193e3b">Specialist skills as needed. No fixed sequence.</text>
